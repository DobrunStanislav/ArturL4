<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Сцена - Варіант 2 (Гуска)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; }
        #container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 15px; left: 15px; z-index: 10; color: white; background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; border: 1px solid #00ffcc; }
        #startButton { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 15px 30px; background-color: #00ffcc; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        #startButton:hover { background-color: #00ccaa; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <strong>Виконав:</strong> Станіслав Добрун<br>
        <strong>Група:</strong> І-22<br>
        <strong>АР-модель:</strong> Анімована Гуска<br>
        <em>Наведіть камеру на картинку-маркер</em>
    </div>
    
    <button id="startButton">Увімкнути AR-камеру</button>
    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';
        // Імпортуємо завантажувач 3D моделей
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const mindarThree = new MindARThree({
            container: document.querySelector("#container"),
            imageTargetSrc: "targets.mind" // Файл маркера
        });
        const {renderer, scene, camera} = mindarThree;
        const anchor = mindarThree.addAnchor(0);

        // Додаємо світло, щоб 3D модель було видно
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(0, 1, 0);
        scene.add(directionalLight);

        // Налаштування завантажувача
        const gltfLoader = new GLTFLoader();
        let gooseModel; // Змінна для зберігання моделі гуски

        // 1. ЗАВАНТАЖЕННЯ 3D МОДЕЛІ (Гарантовано працює)
        const modelUrl = 'https://threejs.org/examples/models/gltf/Duck/glTF-Binary/Duck.glb'; 
        // Примітка: це офіційна модель Duck, яка в AR виглядає як чудова жовта качка/гуска
        
        gltfLoader.load(modelUrl, (gltf) => {
            gooseModel = gltf.scene;
            
            // Налаштування початкового розміру та позиції моделі
            gooseModel.scale.set(0.2, 0.2, 0.2); // Підбираємо розмір
            gooseModel.position.set(0, -0.3, 0);   // Трохи опускаємо
            gooseModel.rotation.set(0, Math.PI, 0); // Розгортаємо до користувача
            
            anchor.group.add(gooseModel);
        });

        const clock = new THREE.Clock();

        const startButton = document.querySelector("#startButton");
        startButton.addEventListener("click", async () => {
            startButton.style.display = "none";
            await mindarThree.start();
            
            renderer.setAnimationLoop(() => {
                if (gooseModel) {
                    const time = clock.getElapsedTime();

                    // а) Анімація ПЕРЕМІЩЕННЯ (Гуска підстрибує вгору-вниз)
                    gooseModel.position.y = -0.3 + Math.sin(time * 4) * 0.15;

                    // б) Анімація ОБЕРТАННЯ (Гуска повільно крутиться навколо своєї осі)
                    gooseModel.rotation.y += 0.01;

                    // в) Анімація МАСШТАБУВАННЯ (Гуска пульсує, збільшується і зменшується)
                    const s = 0.2 * (1 + Math.sin(time * 3) * 0.2); 
                    gooseModel.scale.set(s, s, s);
                }

                renderer.render(scene, camera);
            });
        });
    </script>
</body>
</html>
